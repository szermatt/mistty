name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
    branches: # do not trigger on tag push
      - '**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - 29.1
          - 30.1
          - 31.1

    steps:
    - name: Check out the source code
      uses: actions/checkout@v4

    - name: Install Nix and set up Emacs
      uses: jcs090218/setup-emacs@master
      with:
        version: ${{matrix.emacs_version}}

    - name: Install Test dependencies
      run: nix develop --command true

    - name: Install Eldev
      uses: emacs-eldev/setup-eldev@v1

    - name: Test the module
      run: 'cargo test'

    - name: Build the module
      run: 'eldev build mistty-alacritty-vt-dev.so'

    - name: Test the project
      run: nix develop --command bash -l -c 'eldev -DtTQ test -B --ci || eldev -dtT test --ci :failed'

    - name: Make sure the tests compile without errors
      run: eldev compile -s test
